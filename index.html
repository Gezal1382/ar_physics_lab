<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آزمایشگاه فیزیک AR - تعامل با کنترلر Quest 3</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Tahoma, sans-serif;
            background-color: #111;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.88);
            color: #00ffcc;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid rgba(0,255,204,0.4);
            line-height: 1.8;
            width: 300px;
            z-index: 10;
        }
        #info-panel span {
            color: #ffffff;
            font-weight: bold;
        }
        .btn {
            background-color: #00ffcc;
            color: #111;
            border: none;
            padding: 6px 12px;
            margin: 5px 2px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: Tahoma, sans-serif;
        }
        .btn:hover {
            background-color: #00cca3;
        }
        input[type=range] {
            width: 100%;
            margin: 8px 0;
        }
        #data-table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
            font-size: 11px;
            color: #fff;
        }
        #data-table th, #data-table td {
            border: 1px solid #444;
            padding: 4px;
            text-align: center;
        }
        #data-table th {
            background-color: #222;
            color: #00ffcc;
        }
        #ar-ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <strong>آزمایشگاه فیزیک AR (نسخه Quest 3)</strong><br>
        طول نخ ($L$): <span id="length-display">1.0</span> متر<br>
        <input type="range" id="length-slider" min="0.5" max="1.8" step="0.1" value="1.0" oninput="changeLength(this.value)"><br>
        دوره تناوب تئوری ($T$): <span id="period-val">2.00</span> ثانیه<br>
        وضعیت آونگ: <span id="status-val" style="color: yellow;">در حال نوسان</span><br>
        <div style="text-align: center; margin-top: 8px;">
            <button class="btn" onclick="toggleRelease()">گرفتن / رها کردن</button>
            <button class="btn" onclick="recordData()">ثبت رکورد</button>
            <button class="btn" onclick="downloadReport()" style="background-color: #ff3366; color: white;">دانلود گزارش</button>
        </div>
        <table id="data-table">
            <thead>
                <tr>
                    <th>شماره</th>
                    <th>طول (متر)</th>
                    <th>دوره تناوب (ثانیه)</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <div id="ar-ui"></div>

    <!-- بارگذاری Three.js از CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ۱. ایجاد صحنه، دوربین و رندرور
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3.5);
        camera.lookAt(0, 0.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // فعال‌سازی WebXR
        document.body.appendChild(renderer.domElement);

        // ۲. نورپردازی
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // ۳. ساخت میز آزمایش
        const tableGeo = new THREE.BoxGeometry(3, 0.1, 2);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.5 });
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.position.set(0, -0.05, 0);
        scene.add(table);

        // ۴. ساخت پایه و سازه آونگ
        const standMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });

        const standGeo = new THREE.CylinderGeometry(0.02, 0.02, 2.0, 16);
        const stand = new THREE.Mesh(standGeo, standMat);
        stand.position.set(0, 1.0, 0);
        scene.add(stand);

        const armGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.8, 16);
        const arm = new THREE.Mesh(armGeo, standMat);
        arm.rotation.z = Math.PI / 2;
        arm.position.set(0.4, 2.0, 0);
        scene.add(arm);

        const bobGeo = new THREE.SphereGeometry(0.12, 32, 32);
        const bobMat = new THREE.MeshStandardMaterial({ color: 0xff3366, metalness: 0.3, roughness: 0.2 });
        const bob = new THREE.Mesh(bobGeo, bobMat);
        scene.add(bob);

        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const lineGeo = new THREE.BufferGeometry();
        const line = new THREE.Line(lineGeo, lineMat);
        scene.add(line);

        // ۵. راه‌اندازی WebXR و دکمه AR سازگار با دست/کنترلر
        const arUiContainer = document.getElementById('ar-ui');

        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                if (supported) {
                    const arButton = document.createElement('button');
                    arButton.innerHTML = 'شروع آزمایش در واقعیت افزوده (AR)';
                    arButton.className = 'btn';
                    arButton.style.backgroundColor = '#ff3366';
                    arButton.style.color = '#ffffff';
                    arButton.style.padding = '12px 24px';
                    arButton.style.fontSize = '15px';
                    arButton.style.borderRadius = '8px';
                    arButton.style.boxShadow = '0 4px 10px rgba(0,0,0,0.5)';

                    arButton.addEventListener('click', () => {
                        navigator.xr.requestSession('immersive-ar', {
                            requiredFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                        }).then((session) => {
                            renderer.xr.setSession(session);
                            scene.background = null;
                            arUiContainer.style.display = 'none';
                        });
                    });

                    arUiContainer.appendChild(arButton);
                } else {
                    arUiContainer.innerHTML = '<div style="color:yellow; background:rgba(0,0,0,0.8); padding:8px 12px; border-radius:5px; font-size:11px;">حالت AR روی این دستگاه پشتیبانی نمی‌شود</div>';
                }
            });
        } else {
            arUiContainer.innerHTML = '<div style="color:yellow; background:rgba(0,0,0,0.8); padding:8px 12px; border-radius:5px; font-size:11px;">WebXR پشتیبانی نمی‌شود</div>';
        }

        // ۶. متغیرهای فیزیکی و تعامل گرفتن/رها کردن
        let L = 1.0; 
        const g = 9.81; 
        let theta0 = Math.PI / 4; 
        let theta = theta0;
        let omega = 0; 
        let isGrabbed = false; // آیا کاربر آونگ را گرفته است؟

        function updatePhysicsCalculations() {
            const period = 2 * Math.PI * Math.sqrt(L / g);
            document.getElementById('period-val').innerText = period.toFixed(2);
            document.getElementById('length-display').innerText = L.toFixed(1);
        }
        updatePhysicsCalculations();

        function changeLength(val) {
            L = parseFloat(val);
            updatePhysicsCalculations();
        }

        function toggleRelease() {
            isGrabbed = !isGrabbed;
            document.getElementById('status-val').innerText = isGrabbed ? "در حال کشش / رها شده" : "در حال نوسان";
            if(isGrabbed) {
                omega = 0; // متوقف کردن سرعت هنگام گرفتن
                theta = Math.PI / 3; // دور کردن وزنه برای کشش
            }
        }

        let recordedData = [];

        function recordData() {
            const currentPeriod = (2 * Math.PI * Math.sqrt(L / g)).toFixed(2);
            recordedData.push({
                id: recordedData.length + 1,
                length: L.toFixed(1),
                period: currentPeriod
            });
            updateTable();
        }

        function updateTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            recordedData.forEach(row => {
                tbody.innerHTML += `<tr><td>${row.id}</td><td>${row.length}</td><td>${row.period}</td></tr>`;
            });
        }

        function downloadReport() {
            if (recordedData.length === 0) {
                alert('ابتدا حداقل یک رکورد ثبت کنید!');
                return;
            }
            let content = "--- گزارش آزمایشگاه فیزیک (آونگ ساده - Meta Quest 3) ---\n\n";
            recordedData.forEach(r => {
                content += `آزمایش ${r.id} -> طول نخ: ${r.length} متر | دوره تناوب: ${r.period} ثانیه\n`;
            });

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Physics_Lab_Report_AR.txt';
            a.click();
        }

        // ۷. حلقه انیمیشن
        const clock = new THREE.Clock();

        function animate() {
            const dt = clock.getDelta();

            // اگر کاربر وزنه را نگرفته باشد، فیزیک نوسان اجرا می‌شود
            if (!isGrabbed) {
                const alpha = -(g / L) * Math.sin(theta);
                omega += alpha * dt;
                theta += omega * dt;
            }

            const pivotX = 0.4;
            const pivotY = 2.0;
            const pivotZ = 0;

            const bobX = pivotX + L * Math.sin(theta);
            const bobY = pivotY - L * Math.cos(theta);
            const bobZ = pivotZ;

            bob.position.set(bobX, bobY, bobZ);

            const positions = new Float32Array([
                pivotX, pivotY, pivotZ,
                bobX, bobY, bobZ
            ]);
            lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            lineGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
